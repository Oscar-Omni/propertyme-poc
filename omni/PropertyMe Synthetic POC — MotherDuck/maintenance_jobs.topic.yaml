label: Maintenance Jobs
description: "Property maintenance job performance: volumes, approval and
  completion cycle times, repair spend, missing invoices and repeat repairs by
  agency, supplier, manager, property and category."

joins:
  propertyme_poc_685_main__propertyme_demo_properties: {}
  propertyme_poc_685_main__propertyme_demo_managers: {}
  propertyme_poc_685_main__propertyme_demo_quotes: {}
  propertyme_poc_685_main__propertyme_demo_bills: {}
