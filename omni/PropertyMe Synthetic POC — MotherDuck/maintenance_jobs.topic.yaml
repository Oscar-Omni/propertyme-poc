ai_context: Base grain is one job. Use Maintenance Jobs measures for counts,
  spend (dollars), cycle hours, missing-invoice and repeat-repair rates. Agency
  and supplier names are on the job view. Quotes, bills and work orders are
  one-to-many to jobs; prefer job-level measures unless the user asks about
  quote or bill detail. Data is synthetic demo data.
