name: Maintenance eval offline checks

on:
  pull_request:
    paths:
      - '.github/scripts/omni_eval*'
      - '.github/workflows/maintenance-eval*.yml'
      - 'tests/test_omni_eval.py'
  push:
    branches: [main, ci/maintenance-native-evals]
    paths:
      - '.github/scripts/omni_eval*'
      - '.github/workflows/maintenance-eval*.yml'
      - 'tests/test_omni_eval.py'

permissions:
  contents: read

concurrency:
  group: maintenance-eval-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test native API contract offline
        run: python -m unittest discover -s tests -v
      - name: Compile runner
        run: python -m py_compile .github/scripts/omni_eval.py
